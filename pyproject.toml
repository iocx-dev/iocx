[project]
name = "iocx"
version = "0.7.4"
description = "A deterministic, high‑performance static‑analysis engine that extracts high‑signal IOCs from PE binaries, text, and logs — built for SOC automation and modern threat‑analysis pipelines."
authors = [
    { name = "MalX Labs" }
]
readme = { file = "README-pypi.md", content-type = "text/markdown" }
requires-python = ">=3.9"

license = { text = "MPL-2.0" }

keywords = [
    "ioc",
    "threat-intel",
    "malware-analysis",
    "forensics",
    "security",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",

    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pefile>=2024.8.26",
    "python-magic>=0.4.27",
    "idna>=3.6",
]

[project.scripts]
iocx = "iocx.cli.main:main"

[project.urls]
Homepage = "https://iocx.dev"
Repository = "https://github.com/iocx-dev/iocx"
Issues = "https://github.com/iocx-dev/iocx/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
